[project]
name = "aevum"
version = "0.1.0"
description = "AEVUM — a neural codec by Manifestro"
readme = "README.md"
authors = [
    { name = "karl4th", email = "bagzhankarl@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "soundfile>=0.14.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
